name: Build and Release
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate Version
        id: shell
        run: |
          echo "version=$(date -u '+%Y.%-m%d.%-H%M.0')" >> $GITHUB_OUTPUT

      - name: Build Jellyfin Plugin for release
        run: |
          dotnet build Jellyfin.Plugin.PhoenixAdult/PhoenixAdult.csproj -c Release /p:Version=${{ steps.shell.outputs.version }}

      - name: Build Emby Plugin for release
        run: |
          dotnet build Jellyfin.Plugin.PhoenixAdult/PhoenixAdult.csproj -c Release.Emby /p:Version=${{ steps.shell.outputs.version }}

      - name: Print Folder Tree
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          exclude: "obj|.git"
          path: .
          depth: 8

      - name: Generate Manifest
        env:
          # The plugin only supports Jellyfin 12+ (net10.0 / Jellyfin.Controller 12.x)
          # since v2026.912.926.0, so every published version pins targetAbi 12.0.0.0.
          TARGET_ABI: "12.0.0.0"
        run: |
          scripts/manifest.sh Jellyfin.Plugin.PhoenixAdult@v${{ steps.shell.outputs.version }}.zip

      - name: Verify Manifest targets Jellyfin 12
        run: |
          # New releases require Jellyfin 12+ (targetAbi 12.0.0.0), while the unmaintained
          # pre-12 entries must stay in dist so Jellyfin 10.x installs keep working.
          jq -e '
            .[0].versions[0].targetAbi == "12.0.0.0"
            and ([.[0].versions[] | select(.targetAbi != "12.0.0.0")] | length > 0)
          ' manifest.json > /dev/null
          echo "OK: newest version requires Jellyfin 12 and legacy pre-12 entries are preserved"

      - name: Publish Manifest
        run: |
          git config --global user.name  'phoenixadult-bot'
          git config --global user.email 'phoenixadult-bot@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}

          git checkout --orphan dist
          git rm -rf .
          git add manifest.json
          git commit -m "Auto Updated by Actions"
          git push -f -u origin dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.shell.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: |
            **/Jellyfin.Plugin.PhoenixAdult@v${{ steps.shell.outputs.version }}.zip
            **/Emby.Plugin.PhoenixAdult@v${{ steps.shell.outputs.version }}.zip
