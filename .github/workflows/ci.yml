name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    paths:
      - "Jellyfin.Plugin.PhoenixAdult/**"
      - "Jellyfin.Plugin.PhoenixAdult.Tests/**"
      - "data/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Build & offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (Jellyfin)
        run: dotnet build Jellyfin.Plugin.PhoenixAdult/PhoenixAdult.csproj -c Release --nologo

      - name: Build (Emby)
        run: dotnet build Jellyfin.Plugin.PhoenixAdult/PhoenixAdult.csproj -c Release.Emby --nologo

      - name: Run offline tests
        run: dotnet test Jellyfin.Plugin.PhoenixAdult.Tests/Jellyfin.Plugin.PhoenixAdult.Tests.csproj -c Release --nologo --filter "Category!=Online"

  online-smoke:
    name: Online smoke (best effort, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run online probe tests (site probes only, skip batch/smoke)
        run: dotnet test Jellyfin.Plugin.PhoenixAdult.Tests/Jellyfin.Plugin.PhoenixAdult.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ProbeTests&Category=Online" --blame-hang-timeout 30m
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-probe-report
          path: Jellyfin.Plugin.PhoenixAdult.Tests/bin/Release/net10.0/*report*.txt
          if-no-files-found: ignore
